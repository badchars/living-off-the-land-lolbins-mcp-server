<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Icon glow (softer for light mode) -->
    <filter id="icon-glow-light">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Pill backgrounds -->
    <linearGradient id="lpill-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="lpill-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="lpill-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="lpill-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="lpill-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg-light)"/>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="799" height="319" rx="0" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Grid lines -->
  <g stroke="#d97706" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
  </g>

  <!-- Subtle glow orbs -->
  <circle cx="200" cy="140" r="120" fill="#d97706" opacity="0.025"/>
  <circle cx="200" cy="140" r="70" fill="#d97706" opacity="0.03"/>
  <circle cx="620" cy="160" r="100" fill="#0891b2" opacity="0.025"/>
  <circle cx="620" cy="160" r="55" fill="#0891b2" opacity="0.03"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="800" height="2" fill="url(#accent-light)"/>
  <!-- Bottom border accent -->
  <rect x="0" y="318" width="800" height="2" fill="url(#accent-light)"/>

  <!-- Shield with terminal icon -->
  <g transform="translate(400, 80)" filter="url(#icon-glow-light)">
    <!-- Shield shape -->
    <path d="M0,-38 L-28,-24 L-28,4 C-28,22 -10,36 0,42 C10,36 28,22 28,4 L28,-24 Z"
          fill="none" stroke="url(#accent-light)" stroke-width="2.5" opacity="0.8"/>
    <!-- Terminal prompt > -->
    <text x="0" y="2" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="28" font-weight="700" fill="#d97706" opacity="0.7">&gt;_</text>
  </g>

  <!-- Title -->
  <text x="400" y="148" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="22" font-weight="700" fill="#1e293b" letter-spacing="-0.5">living-off-the-land-lolbins-mcp-server</text>

  <!-- Subtitle -->
  <text x="400" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">LOL Binary Intelligence for AI Agents</text>

  <!-- Accent line -->
  <rect x="320" y="185" width="160" height="2" rx="1" fill="url(#accent-light)" opacity="0.5"/>

  <!-- Stats pills row -->
  <g transform="translate(400, 212)">
    <!-- 59 Tools (amber) -->
    <g transform="translate(-230, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="url(#lpill-amber)" stroke="#fbbf24" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d97706">59 Tools</text>
    </g>
    <!-- 10 Catalogs (orange) -->
    <g transform="translate(-118, 0)">
      <rect x="-44" y="-12" width="88" height="24" rx="12" fill="url(#lpill-orange)" stroke="#fdba74" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ea580c">10 Catalogs</text>
    </g>
    <!-- MCP (cyan) -->
    <g transform="translate(-8, 0)">
      <rect x="-28" y="-12" width="56" height="24" rx="12" fill="url(#lpill-cyan)" stroke="#67e8f9" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0891b2">MCP</text>
    </g>
    <!-- CLI (teal) -->
    <g transform="translate(72, 0)">
      <rect x="-24" y="-12" width="48" height="24" rx="12" fill="url(#lpill-teal)" stroke="#5eead4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0d9488">CLI</text>
    </g>
    <!-- 321 Total (red) -->
    <g transform="translate(172, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="url(#lpill-red)" stroke="#fca5a5" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#dc2626">321 Total</text>
    </g>
  </g>

  <!-- Catalog names -->
  <text x="400" y="256" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="0.8">GTFOBins · LOLBAS · LOOBins · LOLDrivers · LOLRMM · WADComs · HijackLibs · MalAPI · WTFBins · LOTS</text>

  <!-- Decorative corner dots -->
  <circle cx="20" cy="20" r="1.5" fill="#d97706" opacity="0.2"/>
  <circle cx="780" cy="20" r="1.5" fill="#0891b2" opacity="0.2"/>
  <circle cx="20" cy="300" r="1.5" fill="#0891b2" opacity="0.2"/>
  <circle cx="780" cy="300" r="1.5" fill="#d97706" opacity="0.2"/>
</svg>
