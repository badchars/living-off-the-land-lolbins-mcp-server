<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-social" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent-social" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow-amber-social">
      <feGaussianBlur stdDeviation="50" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan-social">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="icon-glow-social">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Pill gradients -->
    <linearGradient id="spill-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="spill-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="spill-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="spill-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="spill-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-social)"/>

  <!-- Grid lines -->
  <g stroke="#f59e0b" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="64" x2="1280" y2="64"/>
    <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="192" x2="1280" y2="192"/>
    <line x1="0" y1="256" x2="1280" y2="256"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="384" x2="1280" y2="384"/>
    <line x1="0" y1="448" x2="1280" y2="448"/>
    <line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="0" y1="576" x2="1280" y2="576"/>
    <line x1="128" y1="0" x2="128" y2="640"/>
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="384" y1="0" x2="384" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="896" y1="0" x2="896" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
    <line x1="1152" y1="0" x2="1152" y2="640"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="320" cy="280" r="200" fill="#f59e0b" opacity="0.04"/>
  <circle cx="320" cy="280" r="120" fill="#f59e0b" opacity="0.06"/>
  <circle cx="960" cy="320" r="180" fill="#06b6d4" opacity="0.04"/>
  <circle cx="960" cy="320" r="100" fill="#06b6d4" opacity="0.06"/>
  <!-- Extra subtle glow at center -->
  <circle cx="640" cy="300" r="150" fill="#f97316" opacity="0.02"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent-social)"/>
  <!-- Bottom border accent -->
  <rect x="0" y="637" width="1280" height="3" fill="url(#accent-social)"/>

  <!-- Shield with terminal icon (larger) -->
  <g transform="translate(640, 140)" filter="url(#icon-glow-social)">
    <!-- Shield shape -->
    <path d="M0,-62 L-46,-39 L-46,6 C-46,36 -16,58 0,68 C16,58 46,36 46,6 L46,-39 Z"
          fill="none" stroke="url(#accent-social)" stroke-width="3.5" opacity="0.9"/>
    <!-- Terminal prompt > -->
    <text x="0" y="4" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="46" font-weight="700" fill="#f59e0b" opacity="0.8">&gt;_</text>
  </g>

  <!-- Title -->
  <text x="640" y="270" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-1">living-off-the-land-lolbins-mcp-server</text>

  <!-- Subtitle -->
  <text x="640" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#a1a1aa" letter-spacing="0.8">LOL Binary Intelligence for AI Agents</text>

  <!-- Accent line -->
  <rect x="500" y="332" width="280" height="3" rx="1.5" fill="url(#accent-social)" opacity="0.6"/>

  <!-- Stats pills row -->
  <g transform="translate(640, 385)">
    <!-- 59 Tools (amber) -->
    <g transform="translate(-380, 0)">
      <rect x="-52" y="-17" width="104" height="34" rx="17" fill="url(#spill-amber)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f59e0b">59 Tools</text>
    </g>
    <!-- 10 Catalogs (orange) -->
    <g transform="translate(-200, 0)">
      <rect x="-62" y="-17" width="124" height="34" rx="17" fill="url(#spill-orange)" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f97316">10 Catalogs</text>
    </g>
    <!-- 2500+ Entries (red) -->
    <g transform="translate(-10, 0)">
      <rect x="-68" y="-17" width="136" height="34" rx="17" fill="url(#spill-red)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ef4444">2500+ Entries</text>
    </g>
    <!-- MCP (cyan) -->
    <g transform="translate(178, 0)">
      <rect x="-38" y="-17" width="76" height="34" rx="17" fill="url(#spill-cyan)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#06b6d4">MCP</text>
    </g>
    <!-- CLI (teal) -->
    <g transform="translate(310, 0)">
      <rect x="-32" y="-17" width="64" height="34" rx="17" fill="url(#spill-teal)" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#14b8a6">CLI</text>
    </g>
  </g>

  <!-- Catalog names -->
  <text x="640" y="460" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#52525b" letter-spacing="1.2">GTFOBins · LOLBAS · LOOBins · LOLDrivers · LOLRMM · WADComs</text>

  <!-- Author line -->
  <text x="640" y="490" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12" fill="#3f3f46" letter-spacing="1">HijackLibs · MalAPI · WTFBins · LOTS Project</text>

  <!-- Bottom tagline -->
  <text x="640" y="560" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#3f3f46" letter-spacing="3">MODEL CONTEXT PROTOCOL</text>

  <!-- Author badge -->
  <text x="640" y="590" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11" fill="#52525b" letter-spacing="1.5">badchars</text>

  <!-- Decorative corner dots -->
  <circle cx="30" cy="30" r="2.5" fill="#f59e0b" opacity="0.3"/>
  <circle cx="1250" cy="30" r="2.5" fill="#06b6d4" opacity="0.3"/>
  <circle cx="30" cy="610" r="2.5" fill="#06b6d4" opacity="0.3"/>
  <circle cx="1250" cy="610" r="2.5" fill="#f59e0b" opacity="0.3"/>

  <!-- Side accent lines -->
  <rect x="0" y="200" width="3" height="240" rx="1.5" fill="url(#accent-social)" opacity="0.15"/>
  <rect x="1277" y="200" width="3" height="240" rx="1.5" fill="url(#accent-social)" opacity="0.15"/>
</svg>
