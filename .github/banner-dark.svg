<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="icon-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Pill gradients -->
    <linearGradient id="pill-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg)"/>

  <!-- Grid lines (circuit pattern) -->
  <g stroke="#f59e0b" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="200" cy="140" r="120" fill="#f59e0b" opacity="0.04"/>
  <circle cx="200" cy="140" r="70" fill="#f59e0b" opacity="0.06"/>
  <circle cx="620" cy="160" r="100" fill="#06b6d4" opacity="0.04"/>
  <circle cx="620" cy="160" r="55" fill="#06b6d4" opacity="0.06"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="800" height="2" fill="url(#accent)"/>
  <!-- Bottom border accent -->
  <rect x="0" y="318" width="800" height="2" fill="url(#accent)"/>

  <!-- Shield with terminal icon -->
  <g transform="translate(400, 80)" filter="url(#icon-glow)">
    <!-- Shield shape -->
    <path d="M0,-38 L-28,-24 L-28,4 C-28,22 -10,36 0,42 C10,36 28,22 28,4 L28,-24 Z"
          fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <!-- Terminal prompt > -->
    <text x="0" y="2" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="28" font-weight="700" fill="#f59e0b" opacity="0.8">&gt;_</text>
  </g>

  <!-- Title -->
  <text x="400" y="148" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">living-off-the-land-lolbins-mcp-server</text>

  <!-- Subtitle -->
  <text x="400" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a1a1aa" letter-spacing="0.5">LOL Binary Intelligence for AI Agents</text>

  <!-- Accent line -->
  <rect x="320" y="185" width="160" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Stats pills row -->
  <g transform="translate(400, 212)">
    <!-- 59 Tools (amber) -->
    <g transform="translate(-230, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="url(#pill-amber)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">59 Tools</text>
    </g>
    <!-- 10 Catalogs (orange) -->
    <g transform="translate(-118, 0)">
      <rect x="-44" y="-12" width="88" height="24" rx="12" fill="url(#pill-orange)" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f97316">10 Catalogs</text>
    </g>
    <!-- MCP (cyan) -->
    <g transform="translate(-8, 0)">
      <rect x="-28" y="-12" width="56" height="24" rx="12" fill="url(#pill-cyan)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#06b6d4">MCP</text>
    </g>
    <!-- CLI (teal) -->
    <g transform="translate(72, 0)">
      <rect x="-24" y="-12" width="48" height="24" rx="12" fill="url(#pill-teal)" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#14b8a6">CLI</text>
    </g>
    <!-- 321 Total (red) -->
    <g transform="translate(172, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="url(#pill-red)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ef4444">321 Total</text>
    </g>
  </g>

  <!-- Catalog names -->
  <text x="400" y="256" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="9.5" fill="#52525b" letter-spacing="0.8">GTFOBins · LOLBAS · LOOBins · LOLDrivers · LOLRMM · WADComs · HijackLibs · MalAPI · WTFBins · LOTS</text>

  <!-- Decorative corner dots -->
  <circle cx="20" cy="20" r="1.5" fill="#f59e0b" opacity="0.3"/>
  <circle cx="780" cy="20" r="1.5" fill="#06b6d4" opacity="0.3"/>
  <circle cx="20" cy="300" r="1.5" fill="#06b6d4" opacity="0.3"/>
  <circle cx="780" cy="300" r="1.5" fill="#f59e0b" opacity="0.3"/>
</svg>
